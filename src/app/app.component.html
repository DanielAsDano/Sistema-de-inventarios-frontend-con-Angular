<div class="container">
    <nav class="navbar navbar-expand-lg glass-nav fade-in-up">
        <div class="container-fluid">
            <!-- Branding con ícono moderno -->
            <a class="navbar-brand" routerLink="productos">
                <i class="bi bi-box-seam-fill"></i>
                <span>Sistema de Inventarios</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-3 text-secondary"></i>
            </button>
            
            <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="productos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                            <i class="bi bi-grid-1x2-fill me-1"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" routerLink="agregar-producto" routerLinkActive="active">
                            <i class="bi bi-plus-circle-fill me-1"></i> Agregar Producto
                        </a>
                    </li>   
                </ul>
                
                <!-- Theme Toggle Button -->
                <div class="d-flex align-items-center mt-2 mt-lg-0">
                    <button (click)="toggleTema()" class="theme-toggle-btn" [title]="isDarkMode ? 'Activar Modo Claro' : 'Activar Modo Oscuro'">
                        <i class="bi" [class.bi-sun-fill]="isDarkMode" [class.bi-moon-stars-fill]="!isDarkMode"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</div>

<!-- Contenedor Principal para Vistas con Animación -->
<div class="container pb-5">
    <router-outlet></router-outlet>
</div>
